site_name: LycheeMAS 文档
site_description: 基于 AutoGen 的多智能体系统（MAS）研究框架 —— 统一图抽象 G=(V,E,W,T,M)
repo_url: https://github.com/ecoli-hit/LycheeMAS
repo_name: ecoli-hit/LycheeMAS
docs_dir: docs
copyright: LycheeMAS

theme:
  name: material
  language: zh
  features:
    - navigation.tabs # 顶部标签页（首页/安装/…/API Reference），每个标签独立侧栏（对标 vLLM）
    - navigation.expand # 侧栏默认展开：API Reference 标签下每个模块都可见
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - toc.follow
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: 切换到深色
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: 切换到浅色
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search:
      # CJK 友好分词：让中文标识与关键词可被搜索
      separator: '[\s​\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - include-markdown
  - gen-files:
      scripts:
        - docs/gen_ref_pages.py
  - literate-nav:
      nav_file: SUMMARY.md
  - section-index
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src] # griffe 静态解析 src/lychee_mas，不 import（无需 torch/autogen）
          options:
            docstring_style: google
            docstring_section_style: table
            filters: ["!^_"] # 隐藏下划线私有成员
            members_order: source
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true
            show_root_heading: true
            show_root_full_path: false
            show_source: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            heading_level: 2

nav:
  - 首页: index.md
  - 安装: installation.md
  - 快速上手: quickstart.md
  - 架构与设计: DEVELOPMENT.md
  - Eval 交接:
      - 总览: EVAL_HANDOFF.md
      - 1. 当前开发状态: eval_handoff/01-current-status.md
      - 2. 系统边界与统一语言: eval_handoff/02-system-boundary.md
      - 3. 相关工作与设计依据: eval_handoff/03-related-work.md
      - 4. 模块化结构与实现合同:
          - 章节索引: eval_handoff/04-implementation-contracts.md
          - 4.1 架构与模块地图: eval_handoff/04-architecture-and-module-map.md
          - 4.2 接口与生命周期: eval_handoff/04-interface-and-lifecycle-contracts.md
          - 4.3 资源与 Benchmark: eval_handoff/04-resource-and-benchmark-contracts.md
          - 4.4 TeamSpec v14: eval_handoff/04-team-spec-v14-contract.md
          - 4.5 跨框架 Runtime: eval_handoff/04-framework-runtime-contracts.md
          - 4.6 Deployment 与推理: eval_handoff/04-deployment-and-inference-contracts.md
          - 4.7 Experiment 与 Scheduler: eval_handoff/04-experiment-and-scheduler-contracts.md
          - 4.8–4.9 观测、RunEvent 与指标: eval_handoff/04-observability-and-event-contracts.md
          - 4.10 Eval Studio: eval_handoff/04-studio-contracts.md
      - 5. 系统性评估研究方案: eval_handoff/05-research-plan.md
      - 6. 使用、扩展与交接: eval_handoff/06-operations-and-handoff.md
  - 核心概念:
      - 组件注册与配置: concepts/registry-and-config.md
      - CDM 双通道记忆: concepts/cdm-memory.md
      - 处理层（serial / parallel）: concepts/processing.md
  - 组件开发:
      - 概览: dev/README.md
      - AgentInit: dev/01-agentinit.md
      - AgentDropout: dev/02-agentdropout.md
      - AgentVocab: dev/03-agentvocab.md
      - MASPO: dev/04-maspo.md
  - 开发指南: contributing.md
  - API Reference: reference/
