backend:
  provider: api
  model: qwen-plus
  model_tag: qwen-plus-api
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  api_key_env: DASHSCOPE_API_KEY
  temperature: 0.0
  top_p: 1.0
  seed: 0
  timeout: 180

memory:
  name: dual_channel
  latent_strategy: soft_token
  nl_strategy: prev_output
  max_encode_tokens: 4096
  include_transcript: true

router:
  method: none
  P: 0

run:
  task: gsm8k
  n: 1
  max_rounds: 2
  max_new_tokens: 8192

eval:
  runs_root: runs/benchmarks/api
