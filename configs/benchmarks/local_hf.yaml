backend:
  provider: hf
  device: cuda:0
  dtype: bfloat16
  enable_thinking: false
  do_sample: false
  temperature: 0.7
  top_p: 0.8
  seed: 0

memory:
  name: dual_channel
  latent_strategy: soft_token
  nl_strategy: prev_output
  max_encode_tokens: 4096
  include_transcript: true

router:
  method: none
  P: 0

run:
  task: gsm8k
  n: 1
  max_rounds: 2
  max_new_tokens: 8192

eval:
  runs_root: runs/benchmarks/local_hf
