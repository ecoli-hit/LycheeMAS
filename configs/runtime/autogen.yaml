# runtime=autogen：生产后端（需 extras [runtime]：autogen + torch + transformers）。
# 模型路径走环境变量 LYCHEE_HF_MODEL 或 backend.model_name（不硬编码绝对路径）。
name: autogen
max_new_tokens: 4096   # 每次 agent 生成的最大新 token
max_rounds: 2          # GroupChat 最大轮数
model_id: qwen-3-4b    # 用于同模型对约束 #2 的模型标识
backend:
  model_name: null     # null=回退环境变量 LYCHEE_HF_MODEL
  device: cuda:0
  dtype: bfloat16      # bfloat16 | float16 | float32
  enable_thinking: false
