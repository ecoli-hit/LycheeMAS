# LycheeMAS 顶层配置（Hydra/YAML defaults 组合，CLAUDE.md §7）。
# 命令行覆盖选择实现与超参，例如：
#   PYTHONPATH=src python scripts/run_experiment.py \
#       topology=static memory=cdm aggregator=self_consistency runtime=mock benchmark=gsm8k
#
# 说明：本仓库的 Config 加载器（core 沿用旧 configs/config.py 思路）按「模块名.参数名」分层；
# 真正的组件选择由 REGISTRY + 下面的名字驱动（编排器不改，黄金法则 2）。
defaults:
  - runtime: mock
  - topology: static
  - memory: cdm
  - aggregator: self_consistency
  - _self_

run:
  task: gsm8k        # 任务名（逗号分隔可多任务）
  team: default      # 静态拓扑队伍 profile（null=按 task 自动选）
  n: 5               # 每任务样本数（all/null/0=全量）
  rounds: 2          # 每轮发言轮数
  seed: 0            # 随机种子（可复现，黄金法则 6）

eval:
  results_root: runs/lychee   # 结果根目录（叶子=[model]/[method]/[task]）
