# CDM 统一参数配置（默认值）。
# 约定（开发规则 3）：参数按「模块名.具体参数名」分层管理 —— YAML 嵌套一层即模块名，
#   叶子即参数名；代码里用点号路径访问，如 cfg.get("backend.model_path")。
# 用法：
#   python run_mas.py --config configs/default.yaml
#   python run_mas.py --config configs/default.yaml --task gsm8k --method both   # 命令行覆盖 YAML
# 命令行显式传入的同名参数会覆盖本文件；本文件未列的项用代码内默认值。

backend:                         # HF 模型后端（LycheeMAS/backends/backend_hf.py）
  model_path: /data/mxy/Models/Qwen/Qwen3-4B   # 模型权重路径
  model_tag: qwen3-4b            # 结果落盘目录用的模型标签（results/.../[model_tag]/...）
  device: cuda:0                 # 运行设备；多卡时配合环境变量 CUDA_VISIBLE_DEVICES 使用
  dtype: bfloat16                # 计算精度：bfloat16 | float16 | float32
  enable_thinking: false         # 是否开启 Qwen3 思考模式（探针默认关，避免冗长输出）

memory:                          # 记忆方法接缝（LycheeMAS/memory/）
  name: dual_channel             # 记忆管理器：dual_channel | mem0 | ama（后两者为桩）
  latent_strategy: soft_token    # latent 通道方法：soft_token(正确) | segment_mean | stride | tail
  nl_strategy: prev_output       # NL 通道方法：prev_output(原样传上一个 agent 输出)；后续可扩展
  max_encode_tokens: 4096        # 编码记忆 source 时最多取多少 token（过长截断）
  include_transcript: true       # 是否把运行中的 MAS 对话并入记忆 source
  tau: 1.0                       # soft_token 温度（越小越接近 argmax；仅 soft_token 用）

router:                          # 编排控制器（LycheeMAS/router/）= 选择① + 信息编排②
  selection: roundrobin          # ① agent 选择：roundrobin（轮转）| selector（AutoGen LLM 选）
  method: nl_only                # ② 记忆通道决策（channel decider）：none|nl_only|latent_only|both|router_static|router_learned|soft_gate|mem0|ama
  P: 16                          # latent prefix 长度（latent 通道成本旋钮）

run:                             # 单次实验运行参数（run_mas.py）
  task: gsm8k                    # 任务名，逗号分隔可跑多个：gsm8k,medqa,locomo10
  team: null                     # 队伍 profile：null=按 task 自动选；填 single 即单模型 baseline
  n: 5                           # 每个任务取样本数（all/null/0 = 全量）
  max_rounds: 2                  # GroupChat 最大轮数（manager→worker→verifier 循环）
  max_new_tokens: 4096            # 每次 agent 生成的最大新 token（够长以免截断答案）

eval:                            # 评测与落盘（LycheeMAS/benchs/metrics.py）
  results_root: /data/mxy/Project/CDM/results/autogen_base   # 结果根目录（叶子=[model]/[method]/[task]）
