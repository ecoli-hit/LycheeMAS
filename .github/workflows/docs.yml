# 文档站自动部署：push 主线（LycheeMASv*）即构建 MkDocs 并发布到 GitHub Pages。
# 一次性前置：仓库 Settings → Pages → Source 选 "GitHub Actions"。
name: docs

on:
  push:
    branches: ["LycheeMASv*", "main"]
    paths: ["docs/**", "mkdocs.yml", "src/lychee_mas/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install docs toolchain（[docs] extra；API Reference 走 griffe 静态解析，无需 torch）
        run: pip install -e ".[docs]"
      - name: Build site
        env:
          DISABLE_MKDOCS_2_WARNING: "true"
        run: mkdocs build --strict || mkdocs build   # strict 失败时退非严格并在日志留痕
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
